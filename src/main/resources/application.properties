server.port=8080
spring.application.name=Bharat Voter Dashboard

# ── Google Maps API ───────────────────────────────────────────────────────────
# Reads from GOOGLE_MAPS_API_KEY environment variable (set in .env or system env)
google.maps.api.key=${GOOGLE_MAPS_API_KEY:}

# ── Gemini REST API ───────────────────────────────────────────────────────────
# Reads from GEMINI_API_KEY environment variable
gemini.api.key=${GEMINI_API_KEY:}

# ── GCP (for Vertex AI / Document AI — optional) ─────────────────────────────
gcp.project.id=${GCP_PROJECT_ID:}
gcp.region=${GCP_REGION:us-central1}
gcp.docai.processor.id=${DOCAI_PROCESSOR_ID:}
gcp.vertex.datastore.id=${VERTEX_SEARCH_DATASTORE_ID:}

# ── Vaadin ────────────────────────────────────────────────────────────────────
vaadin.launch-browser=false
vaadin.whitelisted-packages=com.vaadin,org.vaadin,dev.hilla,com.election

# ── Spring Security ───────────────────────────────────────────────────────────
spring.security.user.name=voter
spring.security.user.password=voter123

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.election=INFO
logging.level.com.vaadin=WARN
